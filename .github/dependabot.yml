version: 2

updates:
  - package-ecosystem: composer
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'Africa/Abidjan'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - php
    groups:
      # Groupe toutes les mises à jour Symfony ensemble
      symfony:
        patterns:
          - 'symfony/*'
      # Groupe les outils de dev ensemble
      dev-tools:
        dependency-type: development
        patterns:
          - 'phpunit/*'
          - 'phpstan/*'
          - 'friendsofphp/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'Africa/Abidjan'
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
