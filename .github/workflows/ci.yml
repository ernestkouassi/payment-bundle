name: CI

on:
  push:
    branches: ['master', 'develop']
  pull_request:
    branches: ['master']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} (${{ matrix.stability }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.4.*']
        stability: ['prefer-stable']
        include:
          - php: '8.2'
            symfony: '6.4.*'
            stability: 'prefer-lowest'
        exclude:
          - php: '8.2'
            symfony: '7.4.*'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-php${{ matrix.php }}-sf${{ matrix.symfony }}-${{ matrix.stability }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-php${{ matrix.php }}-sf${{ matrix.symfony }}-${{ matrix.stability }}-
            composer-php${{ matrix.php }}-sf${{ matrix.symfony }}-

      - name: Pin Symfony version
        run: |
          composer require \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/http-foundation:${{ matrix.symfony }}" \
            "symfony/http-kernel:${{ matrix.symfony }}" \
            "symfony/framework-bundle:${{ matrix.symfony }}" \
            --no-update --no-scripts --ansi

      - name: Install dependencies
        run: |
          composer update \
            --${{ matrix.stability }} \
            --prefer-dist \
            --no-interaction \
            --no-scripts \
            --ansi

      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-coverage

  phpstan:
    name: PHPStan (level 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-phpstan-${{ hashFiles('**/composer.json') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts --ansi

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --ansi

  cs:
    name: PHP CS Fixer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-cs-${{ hashFiles('**/composer.json') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts --ansi

      - name: Run PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --ansi

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP avec Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts --ansi

      - name: Run PHPUnit avec coverage
        run: export XDEBUG_MODE=coverage && vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage vers Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
